---
# SecretStore: authenticates to Vault using the home-coordination ServiceAccount
# JWT via Kubernetes auth method. Vault must have a role bound to this SA.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-home-coordination
  namespace: home-coordination
spec:
  provider:
    vault:
      server: "https://vault.security.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "home-coordination"
          serviceAccountRef:
            name: home-coordination
---
# ExternalSecret: syncs Google OAuth credentials and any other secrets from
# Vault path secret/data/prod/homeautomation/* into a Kubernetes Secret.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: home-coordination-secrets
  namespace: home-coordination
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-home-coordination
    kind: SecretStore
  target:
    name: home-coordination-secrets
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: secret/data/prod/homeautomation/google-client-id
        property: value
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: secret/data/prod/homeautomation/google-client-secret
        property: value
    # Uncomment and populate if your weather feature uses an API key
    # (e.g. OpenWeatherMap). See README — not listed in env vars but
    # check server/routes/weather.js for the actual env var name.
    # - secretKey: WEATHER_API_KEY
    #   remoteRef:
    #     key: secret/data/prod/homeautomation/weather-api-key
    #     property: value
